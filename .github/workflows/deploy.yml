name: Deploy

# Pull requests run the tests only. Pushes to main deploy static/ to
# Cloudflare Pages, but only after those same tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test the PVWatts browser client
        run: node --test tests/test_pvwatts_client.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the browser markup and the legacy CLI
        run: python -m unittest tests.test_static_ui tests.test_legacy_cli -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - name: Publish static/ to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static --project-name jch-pvwatts-studio --branch main

      - name: Summarize
        run: echo "Deployed ${{ steps.publish.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
