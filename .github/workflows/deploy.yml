name: Deploy

# Pull requests run the tests only. Pushes to main deploy static/ to
# Cloudflare Pages, but only after those same tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Rebuild the news feed four times a day. Each publisher receives one
    # request per run, so the interval is deliberately generous.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test the PVWatts browser client, the orientation model, the datasheet reader, and the news aggregator
        run: node --test tests/test_pvwatts_client.mjs tests/test_orientation_model.mjs tests/test_datasheet_parser.mjs tests/test_news_fetcher.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the browser markup
        run: python -m unittest tests.test_static_ui -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The site ships the aggregated feed as a static file, so the news list
      # is rebuilt inside the deployment rather than by a visitor's browser.
      # A failed rebuild keeps the committed feed and still deploys.
      - name: Rebuild the aggregated photovoltaic news feed
        continue-on-error: true
        run: node tools/fetch_news.mjs

      - name: Publish static/ to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static --project-name jch-pvwatts-studio --branch main

      - name: Summarize
        run: echo "Deployed ${{ steps.publish.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
